name: Repo Guard
# push is limited to main — an unfiltered [push, pull_request] ran every guard job
# twice per PR-branch push (push event + pull_request synchronize for the same commit).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-private-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Ensure no private config files are committed
        run: python3 scripts/public_repo_guard.py --docs-only --ref HEAD

  check-version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git tag checks
      - name: Version strings in sync (plist ↔ git tag ↔ QL ↔ MCP)
        run: bash scripts/check-version-sync.sh

  check-rule-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify MCP config file references in docs are correct
        run: bash scripts/verify-mcp-docs.sh
      - name: Verify all documented rules have structural CI gates
        run: |
          bash Tests/test-rule-gates.sh
          bash scripts/check-rule-gates.sh
      - name: Verify single-owner publish destinations (only npm-publish.yml may publish)
        run: python3 scripts/check_release_destinations.py

  check-ci-deps:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all build tool deps used in scripts are installed in CI
        run: bash scripts/check-ci-deps.sh
